<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daifugo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Daifugo</h1>
        <button id="restart">Restart Game</button>
      </header>
      <main>
        <section class="table">
          <h2>Table</h2>
          <div class="pile" id="pile"></div>
          <div class="turn-indicator">Current turn: <span id="turn-indicator">Loading…</span></div>
          <div class="log" id="log"></div>
        </section>
        <section class="players" id="players"></section>
      </main>
    </div>
    <template id="player-template">
      <article class="player">
        <header>
          <h3 class="player-name"></h3>
          <span class="player-status">Playing</span>
        </header>
        <div class="hand"></div>
        <footer class="player-controls"></footer>
      </article>
    </template>
    <script src="script.js" type="module"></script>
  </body>
</html>
